name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Bridge + launcher tests
    # Shared self-hosted pool (image ci-shared:3, non-root, no sudo). The image already has
    # tmux, Xvfb, xclip, xauth, x11-utils (xdpyinfo), iproute2 (ss) and /usr/bin/python3, so
    # there is no apt step. No actions/setup-python here: its Python loads libpython3.12.so
    # through LD_LIBRARY_PATH, and the tests start child Pythons with a cleaned environment
    # (run_as in tests/test_platforms.py), so every child exits 127. The image's own
    # /usr/bin/python3 (3.12) has no such need. Java and pwsh are not in the image, so
    # test_platforms.py skips 3
    # instead of the hosted runner's 1: "no java to run the mod's dataDir()" and
    # "pwsh not installed" (both accepted; the Windows installer parse still runs on
    # windows-2022 in the platforms job below).
    runs-on: [self-hosted, ci-shared]
    steps:
      - uses: actions/checkout@v4
      - name: Python (image system python3)
        run: command -v python3 && python3 -V
      - name: macOS + Windows support tests (offline, platform forced)
        run: python3 tests/test_platforms.py
      - name: Launcher tests (offline, fake HOME)
        run: python3 tests/test_launcher.py
      - name: Benchmark logic tests (stats, regression verdicts, port guard; no game)
        run: python3 tests/test_bench.py
      - name: Pinned tmux (the one the product ships, not Ubuntu's)
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, urllib.request
          spec = json.load(open("launcher/manifest.json"))["tmux"]["linux-x86_64"]
          data = urllib.request.urlopen(spec["url"], timeout=60).read()
          assert hashlib.sha256(data).hexdigest() == spec["sha256"], "tmux hash mismatch"
          open("/tmp/omo-tmux", "wb").write(gzip.decompress(data)); os.chmod("/tmp/omo-tmux", 0o755)
          PY
          /tmp/omo-tmux -V
      - name: Bridge tests (disposable tmux server, stub hermes)
        env:
          OMO_TMUX: /tmp/omo-tmux
        run: python3 tests/test_bridge.py
      - name: Release guard - no host paths or secrets in tracked files
        run: |
          if git grep -nIP '/home/(?!you/|x/)[a-z]+/|API_SERVER_KEY=|BEGIN [A-Z ]*PRIVATE KEY' -- ':!bridge/vendor' ':!.github' ':!scripts/package.sh'; then
            echo "::error::host path or secret found"; exit 1
          fi

  platforms:
    name: Platform tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launcher imports and reports this platform
        run: python launcher/omo_setup.py status
        env:
          OMO_NO_SERVICES: "1"
      - name: Installer parses (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e.Count) { $e; exit 1 }
