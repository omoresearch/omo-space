# tmux configuration for the Omo session server (omo-tmux.service).
#
# This server OWNS the shells behind every in-game tab. The bridge only
# attaches views to it, so restarting the bridge (or Minecraft) never touches
# a running command. Keep the server alive with no sessions so the unit does
# not flap, and keep sessions alive with no clients so closing a screen never
# ends a shell.
set -g exit-empty off
set -g exit-unattached off
set -g destroy-unattached off
# A client whose session is destroyed must EXIT. With this off tmux moves the
# client to "the most recently used" session, which cross-wired one station's
# screen onto another workspace (seen in testing). On is the honest choice:
# the view dies, the bridge reports interrupted/exited, the user decides.
set -g detach-on-destroy on
set -g status off
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 10
set -g focus-events on
set -g mouse off
set -g alternate-screen on
set -g allow-passthrough on
set -g set-titles off
set -g remain-on-exit off
# Each view is its own grouped session; size to the newest client so the
# in-game screen that just opened gets the geometry it asked for.
setw -g window-size latest
setw -g aggressive-resize on
# The prefix key would swallow Ctrl+B in editors and TUIs; nobody uses it here.
set -g prefix None
unbind C-b
